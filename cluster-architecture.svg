<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

  <!-- Definitions: arrowheads, drop shadow, db gradient -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="880" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">Hemispheric EEG — Cluster Architecture</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#64748B">Single-machine code generalizes to N provider pods × M consumer pods on Kubernetes</text>

  <!-- ============================================================ -->
  <!-- BAND 1: Control plane -->
  <!-- ============================================================ -->
  <rect x="40" y="100" width="1120" height="170" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="60" y="125" font-size="12" font-weight="700" fill="#4338CA" letter-spacing="1">CONTROL PLANE</text>

  <!-- Orchestrator -->
  <rect x="100" y="145" width="240" height="100" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Orchestrator</text>
  <text x="220" y="192" text-anchor="middle" font-size="11" fill="#475569">Kubernetes Job (one per run)</text>
  <text x="220" y="212" text-anchor="middle" font-size="11" fill="#475569">• resolves filter → visit set</text>
  <text x="220" y="228" text-anchor="middle" font-size="11" fill="#475569">• generates chunk plan</text>

  <!-- Coordinator -->
  <rect x="480" y="145" width="240" height="100" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Coordinator</text>
  <text x="600" y="192" text-anchor="middle" font-size="11" fill="#475569">Redis Streams + consumer groups</text>
  <text x="600" y="212" text-anchor="middle" font-size="11" fill="#475569">• run-scoped chunk queue</text>
  <text x="600" y="228" text-anchor="middle" font-size="11" fill="#475569">• at-least-once via PEL/XACK</text>

  <!-- Metadata DB -->
  <ellipse cx="980" cy="160" rx="80" ry="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <path d="M 900 160 L 900 230 A 80 14 0 0 0 1060 230 L 1060 160" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <ellipse cx="980" cy="160" rx="80" ry="14" fill="none" stroke="#4F46E5" stroke-width="2"/>
  <text x="980" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#1E1B4B">Metadata DB</text>
  <text x="980" y="220" text-anchor="middle" font-size="11" fill="#475569">Postgres • visit index</text>

  <!-- Arrow: Orchestrator → Coordinator -->
  <line x1="340" y1="195" x2="478" y2="195" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="409" y="186" text-anchor="middle" font-size="10" fill="#4338CA" font-style="italic">pushes ChunkRefs</text>

  <!-- Arrow: Orchestrator → Metadata DB -->
  <path d="M 340 220 Q 600 290 900 200" stroke="#4F46E5" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="4 3"/>
  <text x="620" y="278" text-anchor="middle" font-size="10" fill="#4338CA" font-style="italic">filter resolution</text>

  <!-- ============================================================ -->
  <!-- BAND 2: Data plane -->
  <!-- ============================================================ -->
  <rect x="40" y="300" width="1120" height="320" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="60" y="325" font-size="12" font-weight="700" fill="#065F46" letter-spacing="1">DATA PLANE</text>

  <!-- Provider pods row -->
  <text x="60" y="362" font-size="11" font-weight="600" fill="#065F46">Provider pods (N) — stateless, asyncio multi-port servers</text>

  <g>
    <rect x="100" y="375" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="185" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#064E3B">Provider pod 1</text>
    <text x="185" y="420" text-anchor="middle" font-size="10" fill="#475569">asyncio • ports 9000–N</text>
    <text x="185" y="436" text-anchor="middle" font-size="10" fill="#475569">backpressure via drain()</text>
  </g>
  <g>
    <rect x="290" y="375" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="375" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#064E3B">Provider pod 2</text>
    <text x="375" y="420" text-anchor="middle" font-size="10" fill="#475569">asyncio • ports 9000–N</text>
    <text x="375" y="436" text-anchor="middle" font-size="10" fill="#475569">backpressure via drain()</text>
  </g>
  <g>
    <rect x="480" y="375" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#064E3B">Provider pod 3</text>
    <text x="565" y="420" text-anchor="middle" font-size="10" fill="#475569">asyncio • ports 9000–N</text>
    <text x="565" y="436" text-anchor="middle" font-size="10" fill="#475569">backpressure via drain()</text>
  </g>
  <text x="700" y="420" font-size="22" fill="#059669" font-weight="700">···</text>
  <g>
    <rect x="750" y="375" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow)" stroke-dasharray="5 3"/>
    <text x="835" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#064E3B">Provider pod N</text>
    <text x="835" y="420" text-anchor="middle" font-size="10" fill="#475569">kubectl scale</text>
    <text x="835" y="436" text-anchor="middle" font-size="10" fill="#475569">deployment/provider</text>
  </g>

  <!-- K8s Service box around provider pods (visual cue) -->
  <rect x="80" y="362" width="860" height="105" rx="8" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="960" y="415" font-size="10" font-weight="600" fill="#065F46">headless K8s</text>
  <text x="960" y="429" font-size="10" font-weight="600" fill="#065F46">Service</text>
  <text x="960" y="443" font-size="10" fill="#065F46">(DNS SRV)</text>

  <!-- Consumer pods row -->
  <text x="60" y="498" font-size="11" font-weight="600" fill="#065F46">Consumer pods (M) — training workers, one or more TCP connections each</text>

  <g>
    <rect x="100" y="513" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
    <text x="185" y="538" text-anchor="middle" font-size="13" font-weight="700" fill="#0C4A6E">Consumer pod 1</text>
    <text x="185" y="558" text-anchor="middle" font-size="10" fill="#475569">reads 160,016 B chunks</text>
    <text x="185" y="574" text-anchor="middle" font-size="10" fill="#475569">trains on float32 tensor</text>
  </g>
  <g>
    <rect x="290" y="513" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
    <text x="375" y="538" text-anchor="middle" font-size="13" font-weight="700" fill="#0C4A6E">Consumer pod 2</text>
    <text x="375" y="558" text-anchor="middle" font-size="10" fill="#475569">reads 160,016 B chunks</text>
    <text x="375" y="574" text-anchor="middle" font-size="10" fill="#475569">trains on float32 tensor</text>
  </g>
  <g>
    <rect x="480" y="513" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="538" text-anchor="middle" font-size="13" font-weight="700" fill="#0C4A6E">Consumer pod 3</text>
    <text x="565" y="558" text-anchor="middle" font-size="10" fill="#475569">reads 160,016 B chunks</text>
    <text x="565" y="574" text-anchor="middle" font-size="10" fill="#475569">trains on float32 tensor</text>
  </g>
  <text x="700" y="560" font-size="22" fill="#0891B2" font-weight="700">···</text>
  <g>
    <rect x="750" y="513" width="170" height="80" rx="6" fill="#FFFFFF" stroke="#0891B2" stroke-width="2" filter="url(#shadow)" stroke-dasharray="5 3"/>
    <text x="835" y="538" text-anchor="middle" font-size="13" font-weight="700" fill="#0C4A6E">Consumer pod M</text>
    <text x="835" y="558" text-anchor="middle" font-size="10" fill="#475569">kubectl scale</text>
    <text x="835" y="574" text-anchor="middle" font-size="10" fill="#475569">job/consumer</text>
  </g>

  <!-- TCP arrows: providers → consumers. Arrows stop above the label (y=498), label sits above pod tops (y=513). -->
  <line x1="185" y1="457" x2="185" y2="486" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="375" y1="457" x2="375" y2="486" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="565" y1="457" x2="565" y2="486" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="835" y1="457" x2="835" y2="486" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <!-- Light cross-connections to suggest many-to-many -->
  <line x1="270" y1="457" x2="290" y2="510" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)" opacity="0.4"/>
  <line x1="460" y1="457" x2="480" y2="510" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)" opacity="0.4"/>
  <line x1="290" y1="457" x2="270" y2="510" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)" opacity="0.4"/>
  <line x1="480" y1="457" x2="460" y2="510" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)" opacity="0.4"/>

  <text x="990" y="480" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">TCP, 160 KB chunks</text>
  <text x="990" y="494" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">per-connection</text>
  <text x="990" y="508" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">backpressure</text>

  <!-- Provider ↔ Coordinator (pull/ack) -->
  <path d="M 600 245 Q 600 290 600 340" stroke="#4F46E5" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="6 4"/>
  <text x="612" y="290" font-size="10" fill="#4338CA" font-style="italic">pull batch of ChunkRefs</text>
  <text x="612" y="304" font-size="10" fill="#4338CA" font-style="italic">XACK after stream OK</text>

  <!-- ============================================================ -->
  <!-- BAND 3: Storage -->
  <!-- ============================================================ -->
  <rect x="40" y="650" width="1120" height="170" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="60" y="675" font-size="12" font-weight="700" fill="#92400E" letter-spacing="1">STORAGE</text>

  <!-- Object storage -->
  <rect x="200" y="700" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="728" text-anchor="middle" font-size="15" font-weight="700" fill="#78350F">Object Storage</text>
  <text x="340" y="748" text-anchor="middle" font-size="11" fill="#475569">S3 / GCS / Azure Blob</text>
  <text x="340" y="766" text-anchor="middle" font-size="11" fill="#475569">.npy files, range reads</text>
  <text x="340" y="782" text-anchor="middle" font-size="11" fill="#475569">(Range: bytes=N-M)</text>

  <!-- Alt: RWX volume -->
  <rect x="720" y="700" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2" stroke-dasharray="5 3" filter="url(#shadow)"/>
  <text x="860" y="728" text-anchor="middle" font-size="15" font-weight="700" fill="#78350F">RWX Volume (alt)</text>
  <text x="860" y="748" text-anchor="middle" font-size="11" fill="#475569">EFS / FSx / CephFS</text>
  <text x="860" y="766" text-anchor="middle" font-size="11" fill="#475569">POSIX mmap, same code path</text>
  <text x="860" y="782" text-anchor="middle" font-size="11" fill="#475569">as single-node version</text>

  <!-- Provider → Storage arrows: routed around the right side so they don't cross consumer pods -->
  <path d="M 920 415 Q 1080 415 1080 700 L 480 760 Z" fill="none" stroke="none"/>
  <path d="M 920 415 C 1080 415 1080 745 480 745" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#arrow-amber)"/>
  <path d="M 920 415 C 1080 415 1080 745 720 745" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#arrow-amber)" stroke-dasharray="5 3" opacity="0.6"/>
  <text x="1093" y="570" font-size="10" fill="#92400E" font-style="italic" transform="rotate(90, 1093, 570)">byte-range reads from provider pods</text>

  <!-- ============================================================ -->
  <!-- Legend -->
  <!-- ============================================================ -->
  <g transform="translate(60, 838)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="22" y="12" font-size="11" fill="#475569">Control plane</text>

    <rect x="130" y="0" width="14" height="14" rx="2" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="152" y="12" font-size="11" fill="#475569">Data plane</text>

    <rect x="250" y="0" width="14" height="14" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="272" y="12" font-size="11" fill="#475569">Storage</text>

    <line x1="350" y1="7" x2="380" y2="7" stroke="#475569" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="386" y="12" font-size="11" fill="#475569">optional / alternative</text>

    <line x1="510" y1="7" x2="540" y2="7" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="546" y="12" font-size="11" fill="#475569">data flow direction</text>
  </g>
</svg>
